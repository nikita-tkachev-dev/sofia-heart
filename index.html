<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>♡</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .message {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.92);
      width: min(88vw, 520px);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.1s ease, transform 1.1s ease;
      text-shadow: 0 0 28px rgba(190,120,255,.7);
    }
    .message.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .message .name {
      font-size: clamp(28px, 7vw, 56px);
      font-weight: 500;
      letter-spacing: -.03em;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="message" id="message">
    <div class="name">for you ♡</div>
  </div>

  <script>
    // Здесь можно поменять фразу.
    const MESSAGE = "for you ♡";

    // Сколько миллисекунд идёт сборка сердца из хаоса.
    const ASSEMBLE_MS = 2600;
    // Задержка перед появлением текста после того как сердце собралось.
    const MESSAGE_DELAY_MS = 500;

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const message = document.getElementById("message");

    let w, h, dpr, particles = [];
    let startTime = null;
    let messageShown = false;

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function heart(t) {
      // Параметрическое уравнение сердца.
      return {
        x: 16 * Math.sin(t) ** 3,
        y: -(13 * Math.cos(t) - 5 * Math.cos(2*t)
             - 2 * Math.cos(3*t) - Math.cos(4*t))
      };
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = innerWidth;
      h = innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      makeParticles();
    }

    function makeParticles() {
      particles = [];
      const count = Math.min(1250, Math.max(520, Math.floor(w * h / 1550)));
      const scale = Math.min(w, h) * 0.0175;

      for (let i = 0; i < count; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heart(t);

        // Целевая точка на контуре сердца (с небольшим разбросом толщины).
        const thickness = Math.pow(Math.random(), 2.2) * 2.7;
        const a = Math.random() * Math.PI * 2;
        const targetX = p.x * scale + Math.cos(a) * thickness;
        const targetY = p.y * scale + Math.sin(a) * thickness;

        // Стартовая точка — хаотично раскидана по экрану.
        const angle = Math.random() * Math.PI * 2;
        const radius = (Math.min(w, h) * 0.55) + Math.random() * Math.min(w, h) * 0.6;
        const startX = Math.cos(angle) * radius;
        const startY = Math.sin(angle) * radius;

        particles.push({
          startX, startY,
          targetX, targetY,
          phase: Math.random() * Math.PI * 2,
          speed: .35 + Math.random() * .9,
          size: .7 + Math.random() * 1.8,
          alpha: .35 + Math.random() * .65,
          delay: Math.random() * 0.35 // разброс старта, чтобы частицы летели не строем
        });
      }
    }

    function draw(time) {
      if (startTime === null) startTime = time;
      const elapsed = time - startTime;

      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2 - Math.min(h * .01, 10);

      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      for (const p of particles) {
        // Прогресс сборки для конкретной частицы (с индивидуальной задержкой).
        const raw = Math.min(1, Math.max(0, (elapsed / ASSEMBLE_MS) - p.delay) / (1 - p.delay));
        const eased = easeOutCubic(raw);

        const baseX = p.startX + (p.targetX - p.startX) * eased;
        const baseY = p.startY + (p.targetY - p.startY) * eased;

        // Лёгкое дыхание/дрейф — усиливается по мере сборки.
        const pulse = 1 + Math.sin(time * .0022 + p.phase) * .02 * eased;
        const drift = Math.sin(time * .001 * p.speed + p.phase) * .75 * eased;

        const x = cx + baseX * pulse + drift;
        const y = cy + baseY * pulse;

        ctx.fillStyle = `rgba(177, 112, 255, ${p.alpha * (0.4 + 0.6 * eased)})`;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Несколько крупных "искр" — включаются, когда сердце почти собрано.
      const sparkStrength = Math.min(1, Math.max(0, (elapsed / ASSEMBLE_MS) - 0.7) / 0.3);
      if (sparkStrength > 0) {
        for (let i = 0; i < 28; i++) {
          const p = particles[(i * 43) % particles.length];
          const x = cx + p.targetX + Math.sin(time * .001 + i) * 2;
          const y = cy + p.targetY + Math.cos(time * .0012 + i) * 2;
          const s = (1.5 + Math.sin(time * .003 + i) * .7) * sparkStrength;
          ctx.fillStyle = `rgba(205, 157, 255, ${.75 * sparkStrength})`;
          ctx.beginPath();
          ctx.arc(x, y, s, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.restore();

      // Текст появляется один раз, после того как сборка завершилась.
      if (!messageShown && elapsed >= ASSEMBLE_MS + MESSAGE_DELAY_MS) {
        messageShown = true;
        message.classList.add("show");
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);

    document.querySelector(".name").textContent = MESSAGE;

    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
