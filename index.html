<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>♡</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      touch-action: manipulation;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .hint {
      position: fixed;
      left: 50%;
      bottom: max(7vh, 42px);
      transform: translateX(-50%);
      color: rgba(255,255,255,.58);
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: opacity .8s ease;
      user-select: none;
      pointer-events: none;
    }
    .message {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.92);
      width: min(88vw, 520px);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .9s ease, transform .9s ease;
      text-shadow: 0 0 28px rgba(190,120,255,.7);
    }
    .message.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .message .name {
      font-size: clamp(28px, 7vw, 56px);
      font-weight: 500;
      letter-spacing: -.03em;
    }
    .message .sub {
      margin-top: 12px;
      font-size: clamp(14px, 3.8vw, 19px);
      color: rgba(255,255,255,.72);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="message" id="message">
    <div class="name">для Софийки ♡</div>
    <div class="sub">просто хотел оставить тебе это</div>
  </div>

  <div class="hint" id="hint">нажми на сердце</div>

  <script>
    // Здесь можно поменять текст, если захочешь.
    const MESSAGE = "для Софийки ♡";
    const SUBTITLE = "просто хотел оставить тебе это";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const message = document.getElementById("message");
    const hint = document.getElementById("hint");

    let w, h, dpr, particles = [], burst = 0, opened = false;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = innerWidth;
      h = innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      makeParticles();
    }

    function heart(t) {
      // Параметрическое уравнение сердца.
      return {
        x: 16 * Math.sin(t) ** 3,
        y: -(13 * Math.cos(t) - 5 * Math.cos(2*t)
             - 2 * Math.cos(3*t) - Math.cos(4*t))
      };
    }

    function makeParticles() {
      particles = [];
      const count = Math.min(1250, Math.max(520, Math.floor(w * h / 1550)));
      const scale = Math.min(w, h) * 0.0175;

      for (let i = 0; i < count; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heart(t);

        // Небольшой разброс вокруг линии сердца.
        const thickness = Math.pow(Math.random(), 2.2) * 2.7;
        const a = Math.random() * Math.PI * 2;

        particles.push({
          t,
          x: p.x * scale + Math.cos(a) * thickness,
          y: p.y * scale + Math.sin(a) * thickness,
          phase: Math.random() * Math.PI * 2,
          speed: .35 + Math.random() * .9,
          size: .7 + Math.random() * 1.8,
          alpha: .35 + Math.random() * .65
        });
      }
    }

    function draw(time) {
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2 - Math.min(h * .01, 10);
      const scale = Math.min(w, h) * 0.0175;

      // Мягкое свечение.
      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      for (const p of particles) {
        const pulse = 1 + Math.sin(time * .0022 + p.phase) * .025;
        const drift = Math.sin(time * .001 * p.speed + p.phase) * .75;
        const x = cx + p.x * pulse + drift;
        const y = cy + p.y * pulse;

        let alpha = p.alpha;
        let size = p.size;

        if (burst > 0) {
          const dx = p.x / scale;
          const dy = p.y / scale;
          const len = Math.hypot(dx, dy) || 1;
          const force = burst * (0.6 + Math.random() * .5);
          // Burst вычисляется мягко, чтобы сердце не исчезало полностью.
          alpha *= .65 + .35 * Math.cos(burst * 10);
          size *= 1 + force * .35;
        }

        ctx.fillStyle = `rgba(177, 112, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Несколько крупных "искр".
      for (let i = 0; i < 28; i++) {
        const p = particles[(i * 43) % particles.length];
        const x = cx + p.x + Math.sin(time * .001 + i) * 2;
        const y = cy + p.y + Math.cos(time * .0012 + i) * 2;
        const s = 1.5 + Math.sin(time * .003 + i) * .7;
        ctx.fillStyle = "rgba(205, 157, 255, .75)";
        ctx.beginPath();
        ctx.arc(x, y, s, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();

      if (burst > 0) burst *= .91;
      requestAnimationFrame(draw);
    }

    function openHeart() {
      if (opened) return;
      opened = true;
      burst = 1;
      hint.style.opacity = "0";
      message.classList.add("show");

      // Короткий "вдох" сердца после клика.
      setTimeout(() => {
        message.classList.remove("show");
        setTimeout(() => message.classList.add("show"), 350);
      }, 1700);
    }

    canvas.addEventListener("click", openHeart);
    canvas.addEventListener("touchend", openHeart, { passive: true });
    window.addEventListener("resize", resize);

    document.querySelector(".name").textContent = MESSAGE;
    document.querySelector(".sub").textContent = SUBTITLE;

    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
